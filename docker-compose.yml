version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flareport-app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - MONGO_URI=mongodb://mongo:27017/portfolio_builder
      - JWT_SECRET=production_super_secret_jwt_key_987654321
      - NODE_ENV=production
    depends_on:
      - mongo
    volumes:
      - uploads_data:/app/uploads
      - local_db_data:/app/data

  mongo:
    image: mongo:7-jammy
    container_name: flareport-mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
  uploads_data:
  local_db_data:
